note: >-
  An honest zero. MadeThis publishes no API, so there are no API rate limits, no
  documented response headers (X-RateLimit-*, RateLimit-*, Retry-After) and no published
  status code on exhaustion. What MadeThis does publish is a *product usage* quota
  measured in credits — a monthly allowance plus a per-day safety cap that pauses
  autopilot when reached (Starter 5,000/mo and 1,200/day, Growth 10,000/mo and 3,000/day,
  Scale 30,000/mo and 20,000/day; Enterprise is flat-rate and explicitly unmetered). Those
  are subscription entitlements consumed by AI-agent work inside the product, not
  throttles on a callable interface, so they are recorded in plans/madethis-plans-pricing.yml
  rather than as rate limits here. No RateLimits pointer is wired into apis.yml, because
  there is no runtime rate-limit signal for an agent to read.
