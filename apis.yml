aid: madethis
name: MadeThis
description: >-
  MadeThis (madethis.com) is a Y Combinator (Fall 2025) startup based in San
  Francisco that markets itself as "Your AI Co-Founder" — a platform of AI
  employees that build, market, and run a business on the founder's behalf. A
  user describes a business idea and MadeThis autonomously handles website and
  app development, Stripe-based payment and billing setup, ad-campaign creation
  and optimization, 24/7 AI customer support, email automation and cold
  outbound, market and competitor research, and code generation and deployment,
  iterating on founder feedback. It targets e-commerce, SaaS, agencies, online
  courses, coaching, and service businesses across Starter, Growth, Scale, and
  Enterprise tiers. As of this enrichment pass MadeThis publishes no public
  API, developer portal, SDKs, or API documentation — it is a consumer/SMB SaaS
  product, so most API-oriented artifacts are not applicable.
