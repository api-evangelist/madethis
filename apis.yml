aid: madethis
name: MadeThis
description: >-
  MadeThis (madethis.com) is a Y Combinator (Fall 2025) startup based in San
  Francisco, founded in 2025 by Jacob Wright, Cambree Bernkopf and Santiago
  Gomez Paz, that markets itself as "Your AI Co-Founder" and "the autonomous
  business platform" — a team of AI employees that build, market, and run a
  business on the founder's behalf. A user describes a business idea and
  MadeThis autonomously handles website and app development, Stripe-based
  payment and billing setup, ad-campaign creation and optimization, 24/7 AI
  customer support, email automation and cold outbound, market and competitor
  research, and code generation and deployment, iterating on founder feedback.
  It targets e-commerce, SaaS, agencies, online courses, coaching, and service
  businesses across Starter ($49/mo), Growth ($79/mo), Scale ($199/mo) and
  Enterprise (from $5,000/mo) tiers metered in AI-work credits, with an
  Enterprise line that builds a "company brain" digital twin and trains AI
  employees on a customer's top performers. MadeThis publishes no public API,
  developer portal, SDK, CLI or API documentation — every spec path probed on
  madethis.com and on its Convex product backend api.madethis.com returns 404.
  The only machine-readable documents any MadeThis host serves are the OIDC and
  RFC 8414 discovery documents on clerk.madethis.com, a vendor-run identity
  instance for end-user sign-in. Its Enterprise page notes that customer systems
  connect through MCP and ACP, which makes MadeThis an MCP consumer rather than
  an MCP publisher.
