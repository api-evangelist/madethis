note: >-
  MadeThis ships NO MCP server. This artifact exists to record the opposite finding, which
  is easy to misread: MadeThis is an MCP *consumer*. Its Enterprise page, describing the
  tools an AI employee can act in (Google Drive, Gmail, QuickBooks, HubSpot, Notion,
  Linear, Jira, GitHub, Calendar), states verbatim "Anything beyond this list connects
  through MCP & ACP" — MadeThis calls a customer's MCP servers, it does not publish one
  for others to call. No hosted MCP endpoint, no stdio package, and no MCP documentation
  were found. No MCPServer pointer is wired into apis.yml, and none should be added on the
  strength of that sentence: consuming MCP is not an agent surface a third party can reach.
  A candidate tool list cannot be derived either, because MadeThis publishes no OpenAPI to
  derive one from.
